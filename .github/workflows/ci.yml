name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|test|chore|refactor|ci|build|perf)(\([a-z0-9._-]+\))?!?: .+' \
            || { echo "PR title must follow Conventional Commits: $TITLE"; exit 1; }

  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: amw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AMW_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/amw_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install "uv==0.11.32"
      - run: uv sync --all-packages
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Pytest markers registered
        run: uv run python scripts/check_markers.py
      - name: Tests, contract tests, tenancy suite, coverage floor
        run: uv run pytest --cov --cov-report=term-missing
      - name: Secret scan
        run: uv run python scripts/secret_scan.py

  prompt-and-eval-lint:
    # Lints ALL prompts/evals under docs/v4 (27 section 4.4, evals/README.md section 2). Known defects of
    # existing drafts are listed in scripts/docs_lint_baseline.json and are report-only; any new defect,
    # and any defect in a file changed by the PR, blocks. No model calls, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install "uv==0.11.32"
      - run: uv sync --all-packages
      - name: Lint prompts and eval datasets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          extra=""
          if [ -n "$BASE_REF" ]; then extra="--changed-from origin/$BASE_REF"; fi
          uv run python -m amw_evals lint --baseline scripts/docs_lint_baseline.json \
            --report docs-lint-report.md $extra
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-lint-report
          path: docs-lint-report.md

  a11-render-determinism:
    # Proves agent_11 thumbnail rendering does not depend on the host (docs/v4 RV-08, package README
    # "Determinism"): clean Ubuntu images with only the package README's system library (libfribidi0),
    # Python and every dependency from uv.lock (--frozen, Pillow wheel only). Strict mode: the canary
    # raster hashes must be recorded for this FreeType and match (A11_REQUIRE_RECORDED_ENV=1), so the
    # recorded environments are proven here: x86_64 and arm64, FriBiDi 1.0.13 (24.04) and 1.0.16 (26.04).
    # Runs in addition to, never instead of, the gates job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, image: "ubuntu:24.04", uv_arch: x86_64, uv_sha256: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967}
          - {runner: ubuntu-latest, image: "ubuntu:26.04", uv_arch: x86_64, uv_sha256: aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967}
          - {runner: ubuntu-24.04-arm, image: "ubuntu:24.04", uv_arch: aarch64, uv_sha256: 4d4fa08d95b06642e5800df6a22bd71455f23f988269e18da2847971d8c0bf31}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      UV_PYTHON: "3.14"
      UV_PYTHON_DOWNLOADS: automatic
      A11_REQUIRE_RECORDED_ENV: "1"
    steps:
      - name: System packages (the package README list, nothing else)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl libfribidi0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv 0.11.32 (release archive, checksum verified)
        env:
          UV_ARCH: ${{ matrix.uv_arch }}
          UV_SHA256: ${{ matrix.uv_sha256 }}
        run: |
          f="uv-${UV_ARCH}-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$f" "https://github.com/astral-sh/uv/releases/download/0.11.32/$f"
          echo "${UV_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" --strip-components=1 -C /usr/local/bin "uv-${UV_ARCH}-unknown-linux-gnu/uv"
          uv --version
      - name: Install from the lock only
        run: |
          uv lock --check
          uv sync --frozen --no-build-package pillow --all-packages
      - name: Show the rendering environment (probe)
        run: uv run --frozen python scripts/probe_render_env.py
      - name: Determinism and canary tests (three runs, different hash seeds)
        run: |
          for seed in 0 1 2; do
            PYTHONHASHSEED=$seed uv run --frozen pytest -q -p no:cacheprovider --no-cov \
              tests/agents/agent_11_thumbnail_design/test_composer.py \
              "tests/agents/agent_11_thumbnail_design/test_stage.py::test_same_inputs_give_byte_identical_files"
          done
