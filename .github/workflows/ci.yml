name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|test|chore|refactor|ci|build|perf)(\([a-z0-9._-]+\))?!?: .+' \
            || { echo "PR title must follow Conventional Commits: $TITLE"; exit 1; }

  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: amw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AMW_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/amw_test
    steps:
      # TODO(ci-pin): pin these actions by commit SHA; api.github.com was unreachable when this was
      # written (no network access to actions/* from the build session), so tags are kept for now.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "uv==0.11.32"
      - run: uv sync --all-packages
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Pytest markers registered
        run: uv run python scripts/check_markers.py
      - name: Tests, contract tests, tenancy suite, coverage floor
        run: uv run pytest --cov --cov-report=term-missing
      - name: Secret scan
        run: uv run python scripts/secret_scan.py

  prompt-and-eval-lint:
    # Lints ALL prompts/evals under docs/v4 (27 section 4.4, evals/README.md section 2). Known defects of
    # existing drafts are listed in scripts/docs_lint_baseline.json and are report-only; any new defect,
    # and any defect in a file changed by the PR, blocks. No model calls, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "uv==0.11.32"
      - run: uv sync --all-packages
      - name: Lint prompts and eval datasets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          extra=""
          if [ -n "$BASE_REF" ]; then extra="--changed-from origin/$BASE_REF"; fi
          uv run python -m amw_evals lint --baseline scripts/docs_lint_baseline.json \
            --report docs-lint-report.md $extra
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-lint-report
          path: docs-lint-report.md

  a11-render-determinism:
    # Proves agent_11 thumbnail rendering does not depend on the host (docs/v4 RV-08, package README
    # "Determinism"): a clean Ubuntu 24.04 image with only what the package README lists (libfribidi0),
    # Python and every dependency from uv.lock (--frozen; Pillow wheel only, never built against system libs). The canary raster hash must equal the
    # one recorded for this exact Pillow/FreeType/Raqm/HarfBuzz/FriBiDi/CPU fingerprint; an unrecorded
    # environment fails closed. Runs in addition to, never instead of, the gates job.
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    env:
      UV_PYTHON: "3.14"
      UV_PYTHON_DOWNLOADS: automatic
    steps:
      - name: System packages (the package README list, nothing else)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl libfribidi0
      # TODO(ci-pin): pin by commit SHA like the other jobs (no network access to actions/* when written).
      - uses: actions/checkout@v4
      - name: Install uv (pinned)
        run: |
          curl -LsSf https://astral.sh/uv/0.11.32/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install from the lock only
        run: |
          uv lock --check
          uv sync --frozen --no-build-package pillow --all-packages
      - name: Show the rendering environment
        run: |
          uv run --frozen python - <<'PY'
          from agent_11_thumbnail_design.pinning import current_fingerprint, environment_problem
          print(current_fingerprint().key)
          assert environment_problem() is None, environment_problem()
          PY
      - name: Determinism and canary tests (three runs, different hash seeds)
        run: |
          for seed in 0 1 2; do
            PYTHONHASHSEED=$seed uv run --frozen pytest -q -p no:cacheprovider --no-cov \
              tests/agents/agent_11_thumbnail_design/test_composer.py \
              "tests/agents/agent_11_thumbnail_design/test_stage.py::test_same_inputs_give_byte_identical_files"
          done
