[project]
name = "amw-adapters"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
    "amw-core",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amw_adapters"]

[tool.uv.sources]
amw-core = { workspace = true }
