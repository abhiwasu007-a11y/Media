[project]
name = "amw-core"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = ["pydantic>=2.10", "pydantic-settings>=2.6", "psycopg[binary]>=3.2", "jsonschema>=4.23", "fonttools>=4.55"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amw_core"]

[tool.uv.sources]

