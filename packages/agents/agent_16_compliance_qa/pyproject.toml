[project]
name = "agent-16-compliance-qa"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = ["amw-core", "amw-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_16_compliance_qa"]

[tool.uv.sources]
amw-core = { workspace = true }
amw-runtime = { workspace = true }
