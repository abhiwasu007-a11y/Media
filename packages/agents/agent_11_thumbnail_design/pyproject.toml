[project]
name = "agent-11-thumbnail-design"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = ["amw-core", "amw-adapters", "pillow==13.0.0", "fonttools>=4.55"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_11_thumbnail_design"]

[tool.uv.sources]
amw-core = { workspace = true }
amw-adapters = { workspace = true }
