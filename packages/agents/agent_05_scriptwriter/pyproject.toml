[project]
name = "agent-05-scriptwriter"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = ["amw-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_05_scriptwriter"]

[tool.uv.sources]
amw-core = { workspace = true }

[tool.coverage.run]
branch = true
source = ["agent_05_scriptwriter"]

[tool.coverage.report]
fail_under = 80
show_missing = true
