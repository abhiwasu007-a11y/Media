[project]
name = "amw-media-factory"
version = "0.0.0"
description = "AMW AI Media Factory (workspace root). Design baseline: docs/v4/"
requires-python = "==3.14.*"
dependencies = [
  "amw-core", "amw-adapters", "amw-orchestrator",
  "agent-04-research-knowledge", "agent-05-scriptwriter", "agent-06-fact-checker",
  "agent-07-voice-production", "agent-08-visual-assets", "agent-09-video-director",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.13",
  "ruff>=0.8",
  "jsonschema>=4.23",
  "psycopg[binary]>=3.2",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/amw_core", "packages/amw_adapters", "packages/amw_orchestrator", "packages/agents/*"]

[tool.uv.sources]
amw-core = { workspace = true }
amw-adapters = { workspace = true }
amw-orchestrator = { workspace = true }
agent-04-research-knowledge = { workspace = true }
agent-05-scriptwriter = { workspace = true }
agent-06-fact-checker = { workspace = true }
agent-07-voice-production = { workspace = true }
agent-08-visual-assets = { workspace = true }
agent-09-video-director = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py314"
src = ['packages/amw_core/src', 'packages/amw_adapters/src', 'packages/amw_orchestrator/src', 'packages/agents/agent_04_research_knowledge/src', 'packages/agents/agent_05_scriptwriter/src', 'packages/agents/agent_06_fact_checker/src', 'packages/agents/agent_07_voice_production/src', 'packages/agents/agent_08_visual_assets/src', 'packages/agents/agent_09_video_director/src']

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT", "N", "ANN", "ASYNC", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.14"
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/packages/amw_core/src:$MYPY_CONFIG_FILE_DIR/packages/amw_adapters/src:$MYPY_CONFIG_FILE_DIR/packages/amw_orchestrator/src:$MYPY_CONFIG_FILE_DIR/packages/agents/agent_04_research_knowledge/src:$MYPY_CONFIG_FILE_DIR/packages/agents/agent_05_scriptwriter/src:$MYPY_CONFIG_FILE_DIR/packages/agents/agent_06_fact_checker/src:$MYPY_CONFIG_FILE_DIR/packages/agents/agent_07_voice_production/src:$MYPY_CONFIG_FILE_DIR/packages/agents/agent_08_visual_assets/src:$MYPY_CONFIG_FILE_DIR/packages/agents/agent_09_video_director/src"
files = ["packages", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "tenancy: cross-tenant isolation suite (04 section 3.7), needs PostgreSQL (AMW_TEST_DATABASE_URL)",
  "state_machine: one test per transition row of 03 section 11",
  "contract: JSON Schema / Pydantic contract compatibility",
]

[tool.coverage.run]
branch = true
source = ["amw_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true
